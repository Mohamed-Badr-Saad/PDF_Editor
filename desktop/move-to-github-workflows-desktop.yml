# Builds the PageCraft desktop app for Windows, macOS and Linux.
# - Run it by hand: GitHub → Actions → "Build desktop app" → Run workflow.
#   The files appear under the run's "Artifacts".
# - Push a version tag (for example: git tag v0.5.0 && git push --tags) to also
#   publish them on the repository's Releases page for anyone to download.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # needed only to attach the files to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Build the web app
        run: |
          npm ci
          npm run build
      - name: Package the desktop app
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned build (no paid certificate)
        run: |
          npm ci
          npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: PageCraft-${{ matrix.target }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
